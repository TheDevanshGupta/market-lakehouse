[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-lakehouse"
version = "0.1.0"
description = "End-to-end market data platform on simulated data: Python ingestion, data quality, dbt + DuckDB star schema, Streamlit."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "duckdb>=1.0",
    "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.5"]
orchestration = ["dagster>=1.8", "dagster-webserver>=1.8"]

[project.scripts]
lakehouse = "lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "E501"]  # line length is enforced by `ruff format`
