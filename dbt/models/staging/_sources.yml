version: 2

sources:
  - name: silver
    description: Validated, de-duplicated Parquet written by the Python ingestion layer.
    meta:
      external_location: "read_parquet('{{ env_var('LAKEHOUSE_DATA_DIR', '../data') }}/silver/{name}/**/*.parquet', hive_partitioning = true, union_by_name = true)"
    tables:
      - name: prices
        description: Daily OHLCV bars, one file per trade_date partition.

  - name: audit
    description: Pipeline run metadata and data-quality rule results.
    meta:
      external_location: "read_parquet('{{ env_var('LAKEHOUSE_DATA_DIR', '../data') }}/audit/{name}/*.parquet', union_by_name = true)"
    tables:
      - name: pipeline_runs
      - name: dq_rule_results
