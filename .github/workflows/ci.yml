name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 13 * * 1-5" # 19:00 IST on weekdays
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,dashboard]"
      - name: Lint
        run: ruff check src tests dashboard
      - name: Unit + end-to-end tests
        run: pytest
      - name: Full pipeline on synthetic data
        run: |
          lakehouse run --start 2024-01-01 --end 2024-12-31
          lakehouse run
      - name: Generate dbt docs
        run: dbt docs generate --project-dir dbt --profiles-dir dbt
        env:
          LAKEHOUSE_DATA_DIR: ${{ github.workspace }}/data
          LAKEHOUSE_WAREHOUSE: ${{ github.workspace }}/data/warehouse.duckdb
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target

